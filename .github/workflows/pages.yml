name: Territory workbench
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rustup show
          archive="wasm-bindgen-0.2.127-x86_64-unknown-linux-musl.tar.gz"
          install_dir="${RUNNER_TEMP}/wasm-bindgen-0.2.127"
          gh release download 0.2.127 --repo wasm-bindgen/wasm-bindgen --pattern "${archive}" --dir "${RUNNER_TEMP}"
          echo "61d4a7dc85acfa0d2354ccc0b8361928c7e52a746d17f28ebaa795ed3dc1614a  ${RUNNER_TEMP}/${archive}" | sha256sum --check
          mkdir -p "${install_dir}"
          tar --extract --gzip --file "${RUNNER_TEMP}/${archive}" --directory "${install_dir}" --strip-components=1
          echo "${install_dir}" >> "${GITHUB_PATH}"
          npm ci
          npx playwright install --with-deps chromium
      - name: Validate Rust
        run: |
          cargo fmt -p terrain-web --check
          cargo test --locked --workspace
          cargo clippy --locked --no-deps -p terrain-web --all-targets --all-features -- -D warnings
      - name: Build Pages and test browser
        run: |
          python tools/build-pages.py
          python tools/check-planner.py --site dist/TERRAIN --output "${RUNNER_TEMP}/terrain-planner-parity"
          npm test
      - name: Retain full planner comparisons
        if: always() && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: terrain-planner-parity
          path: ${{ runner.temp }}/terrain-planner-parity
          if-no-files-found: warn
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/TERRAIN
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
